apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: reglens-config
    data:
      ALLOWED_ORIGINS: "http://localhost:8501"
      DATABASE_URL: "sqlite:////app/data/reglens.db"
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: reglens-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: reglens-backend
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: reglens-backend
      template:
        metadata:
          labels:
            app: reglens-backend
        spec:
          containers:
            - name: backend
              image: reglens-backend:latest
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 8000
              env:
                - name: GROQ_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: reglens-secrets
                      key: GROQ_API_KEY
                - name: ALLOWED_ORIGINS
                  valueFrom:
                    configMapKeyRef:
                      name: reglens-config
                      key: ALLOWED_ORIGINS
                - name: DATABASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: reglens-config
                      key: DATABASE_URL
                - name: LOG_LEVEL
                  valueFrom:
                    configMapKeyRef:
                      name: reglens-config
                      key: LOG_LEVEL
                - name: ENVIRONMENT
                  valueFrom:
                    configMapKeyRef:
                      name: reglens-config
                      key: ENVIRONMENT
              volumeMounts:
                - name: data
                  mountPath: /app/data
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 6
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8000
                initialDelaySeconds: 30
                periodSeconds: 20
                timeoutSeconds: 3
                failureThreshold: 6
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: reglens-data
  - apiVersion: v1
    kind: Service
    metadata:
      name: reglens-backend
    spec:
      selector:
        app: reglens-backend
      ports:
        - name: http
          port: 8000
          targetPort: 8000
      type: ClusterIP
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: reglens-frontend
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: reglens-frontend
      template:
        metadata:
          labels:
            app: reglens-frontend
        spec:
          containers:
            - name: frontend
              image: reglens-frontend:latest
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 8501
              env:
                - name: BACKEND_API_URL
                  value: "http://reglens-backend:8000"
              readinessProbe:
                httpGet:
                  path: /_stcore/health
                  port: 8501
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 6
              livenessProbe:
                httpGet:
                  path: /_stcore/health
                  port: 8501
                initialDelaySeconds: 30
                periodSeconds: 20
                timeoutSeconds: 3
                failureThreshold: 6
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
  - apiVersion: v1
    kind: Service
    metadata:
      name: reglens-frontend
    spec:
      selector:
        app: reglens-frontend
      ports:
        - name: http
          port: 8501
          targetPort: 8501
      type: LoadBalancer

