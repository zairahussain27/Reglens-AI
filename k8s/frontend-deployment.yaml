apiVersion: apps/v1
kind: Deployment
metadata:
  name: reglens-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reglens-frontend
  template:
    metadata:
      labels:
        app: reglens-frontend
    spec:
      containers:
        - name: frontend
          image: reglens-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: BACKEND_API_URL
              value: "http://reglens-backend:8000"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

