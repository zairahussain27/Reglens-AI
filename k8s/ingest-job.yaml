apiVersion: batch/v1
kind: Job
metadata:
  name: reglens-ingest
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          image: reglens-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.ingest"]
          env:
            - name: CHROMA_DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: reglens-config
                  key: CHROMA_DB_PATH
          volumeMounts:
            - name: chroma
              mountPath: /app/chroma_db
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: chroma
          persistentVolumeClaim:
            claimName: reglens-chroma
