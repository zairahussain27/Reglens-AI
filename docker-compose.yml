services:
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      CHROMA_DB_PATH: /app/chroma_db
    volumes:
      - backend-chroma:/app/chroma_db
    command: ["python", "-m", "src.ingest"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      ALLOWED_ORIGINS: http://localhost:8501,http://frontend:8501
      DATABASE_URL: sqlite:////app/data/reglens.db
      CHROMA_DB_PATH: /app/chroma_db
      REQUIRE_VECTOR_STORE_READY: "true"
    volumes:
      - backend-data:/app/data
      - backend-chroma:/app/chroma_db
    depends_on:
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  backend-data:
  backend-chroma:
